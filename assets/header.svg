<svg viewBox="0 0 1000 400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Emilio Galimberti — System Engineer &amp; AI Builder">
  <style>
    :root {
      --bone: #1F2328;
      --rule: #D0D7DE;
      --muted: #656D76;
      --dim: #0969DA;
      --accent: #0070F3;
      --cyan: #0284C7;
      --green: #1A7F37;
    }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", "JetBrains Mono", monospace; }
    .draw { stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1.4s cubic-bezier(.6,0,.2,1) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .rise { opacity: 0; animation: rise .9s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .fade { opacity: 0; animation: fade .7s ease forwards; }
    @keyframes fade { to { opacity: 1; } }
    .a1 { animation-delay: .2s; }
    .a2 { animation-delay: .5s; }
    .a3 { animation-delay: .8s; }
    .a4 { animation-delay: 1.1s; }
    .a5 { animation-delay: 1.3s; }
    .a6 { animation-delay: 1.6s; }

    /* Console typewriter / rotation animation */
    .rot { opacity: 0; animation: rot 12s cubic-bezier(.2,.7,.2,1) infinite; }
    .r1 { animation-delay: 0s; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    .r4 { animation-delay: 9s; }
    @keyframes rot {
      0% { opacity: 0; transform: translateY(6px); }
      3% { opacity: 1; transform: translateY(0); }
      22% { opacity: 1; transform: translateY(0); }
      25% { opacity: 0; transform: translateY(-6px); }
      100% { opacity: 0; }
    }

    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .draw, .rise, .fade, .rot, .cursor { animation: none; }
      .draw { stroke-dashoffset: 0; }
      .rise, .fade { opacity: 1; }
      .rot { opacity: 0; }
      .rot.r1 { opacity: 1; }
      .cursor { opacity: 1; }
    }
  </style>

  <!-- Top metadata line -->
  <line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/>
  <g class="fade a1">
    <text class="mono" fill="var(--muted)" x="48" y="44" font-size="11" letter-spacing="3.5">BYGALIMBERTI — DOSSIER Nº 001</text>
    <text class="mono" fill="var(--muted)" x="952" y="44" font-size="11" letter-spacing="3.5" text-anchor="end">AR — 31.42° S</text>
  </g>

  <!-- Main Hero Title -->
  <g class="rise a2">
    <text fill="var(--bone)" class="mono" x="46" y="174" font-size="70" font-weight="700" letter-spacing="-2">Emilio Galimberti</text>
  </g>

  <!-- Subtitle -->
  <g class="fade a3">
    <text fill="var(--dim)" class="mono" x="48" y="214" font-size="19" font-weight="500">System Engineer &amp; AI Builder — Argentina.</text>
  </g>

  <!-- Focus Section -->
  <g class="fade a4">
    <text fill="var(--accent)" class="mono" x="48" y="268" font-size="12.5" font-weight="600" letter-spacing="1">focus  ▸</text>
    <text fill="var(--muted)" class="mono" x="128" y="268" font-size="12.5" letter-spacing="1">Full-Stack (TS · Angular · Node) · AI Agents &amp; Automation · Homelab &amp; Cloud Infra</text>
  </g>

  <!-- Console Interactive Rotating Line -->
  <g class="fade a5">
    <!-- Prompt symbol & box -->
    <text fill="var(--cyan)" class="mono" x="48" y="298" font-size="13.5" font-weight="700">&gt;</text>
    
    <!-- Rotating console outputs -->
    <g class="rot r1">
      <text fill="var(--bone)" class="mono" x="66" y="298" font-size="13" letter-spacing="0.5">emilio@bygalimberti:~$ whoami --verbose</text>
      <text fill="var(--cyan)" class="mono cursor" x="400" y="298" font-size="13">_</text>
    </g>
    <g class="rot r2">
      <text fill="var(--bone)" class="mono" x="66" y="298" font-size="13" letter-spacing="0.5">aprendo en público, construyo en serio_</text>
      <text fill="var(--cyan)" class="mono cursor" x="420" y="298" font-size="13">_</text>
    </g>
    <g class="rot r3">
      <text fill="var(--bone)" class="mono" x="66" y="298" font-size="13" letter-spacing="0.5">echo "from zero to deployed" &amp;&amp; status: [■ ONLINE]</text>
      <text fill="var(--green)" class="mono cursor" x="515" y="298" font-size="13">_</text>
    </g>
    <g class="rot r4">
      <text fill="var(--bone)" class="mono" x="66" y="298" font-size="13" letter-spacing="0.5">open to engineering challenges · consulting · ai architecture</text>
      <text fill="var(--cyan)" class="mono cursor" x="605" y="298" font-size="13">_</text>
    </g>
  </g>

  <!-- Bottom Divider Line -->
  <line class="draw a5" x1="48" y1="342" x2="952" y2="342" stroke="var(--rule)" stroke-width="1"/>

  <!-- Footer Track Badges -->
  <g class="fade a6">
    <text fill="var(--muted)" class="mono" x="48" y="374" font-size="11.5" letter-spacing="3">FULL-STACK SYSTEMS</text>
    <text fill="var(--accent)" class="mono" x="252" y="374" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="278" y="374" font-size="11.5" letter-spacing="3">AI AGENTS &amp; LLMS</text>
    <text fill="var(--accent)" class="mono" x="475" y="374" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="500" y="374" font-size="11.5" letter-spacing="3">HOMELAB &amp; LINUX</text>
    <text fill="var(--accent)" class="mono" x="702" y="374" font-size="11.5">·</text>
    <text fill="var(--muted)" class="mono" x="728" y="374" font-size="11.5" letter-spacing="3">BEFP CONSULTING</text>
    <text fill="var(--muted)" class="mono" x="952" y="374" font-size="11.5" letter-spacing="3" text-anchor="end">UTN — 2022 / 2026</text>
  </g>
</svg>
